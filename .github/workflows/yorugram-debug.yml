name: YoruGram test APK
on:
  push:
    branches: ['yoru/foundation']
  workflow_dispatch:
    inputs:
      use_project_api:
        description: Build with the project's Telegram API and Firebase configuration
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure project API and Firebase
        if: inputs.use_project_api == true
        env:
          YORU_API_ID: ${{ secrets.YORU_API_ID }}
          YORU_API_HASH: ${{ secrets.YORU_API_HASH }}
          YORU_FIREBASE_JSON: ${{ secrets.YORU_FIREBASE_JSON }}
        run: python3 yoru-build/configure.py
      - name: Check out build dependencies
        run: git submodule update --init --recursive --depth 1 --jobs 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and native build tools
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --silent --show-error --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o "$archive"
          printf '%s  %s\n' 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee "$archive" | sha256sum --check
          mkdir -p "$sdk/cmdline-tools"
          unzip -q "$archive" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk" --licenses < <(yes)
          "$manager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'platform-tools'
      - name: Compile standalone debug variant
        env:
          USE_PROJECT_API: ${{ inputs.use_project_api == true }}
        run: |
          args=()
          if [[ "$USE_PROJECT_API" != true ]]; then
            args+=(-PyoruOfflineSmoke=true)
          fi
          bash gradlew --no-daemon "${args[@]}" :TMessagesProj_AppStandalone:assembleAfatDebug
      - name: Verify APK signature, package and native libraries
        env:
          USE_PROJECT_API: ${{ inputs.use_project_api == true }}
        run: |
          mapfile -t apks < <(find TMessagesProj_AppStandalone/build/outputs/apk -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify "${apks[0]}"
          package=org.yorugram.messenger.web
          filename=YoruGram.apk
          if [[ "$USE_PROJECT_API" != true ]]; then
            package+=.smoke
            filename=YoruGram-Offline-Test.apk
            permissions=$("$tools/aapt" dump permissions "${apks[0]}")
            [[ "$permissions" != *android.permission.INTERNET* ]]
          fi
          badging=$("$tools/aapt" dump badging "${apks[0]}")
          [[ "$badging" == "package: name='$package'"* ]]
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "${apks[0]}" "lib/$abi/libtmessages.49.so"
          done
          mkdir -p dist
          cp "${apks[0]}" "dist/$filename"
      - uses: actions/upload-artifact@v4
        if: inputs.use_project_api != true || github.event.repository.private
        with:
          name: YoruGram-${{ inputs.use_project_api && 'project-api-test' || 'offline-test' }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Install and launch on an Android emulator
        if: inputs.use_project_api != true
        run: |
          sdk="$ANDROID_HOME"
          tools="$sdk/cmdline-tools/latest/bin"
          adb="$sdk/platform-tools/adb"
          image='system-images;android-35;google_apis;x86_64'
          "$tools/sdkmanager" --sdk_root="$sdk" 'emulator' "$image"
          "$tools/avdmanager" create avd --name yoru-smoke --package "$image" <<< no
          acceleration=off
          if [[ -e /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            acceleration=on
          fi
          "$sdk/emulator/emulator" -avd yoru-smoke -no-window -no-audio -no-snapshot \
            -gpu swiftshader_indirect -accel "$acceleration" > "$RUNNER_TEMP/yoru-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 300 "$adb" wait-for-device; then
            cat "$RUNNER_TEMP/yoru-emulator.log"
            exit 1
          fi
          for ((attempt=0; attempt<150; attempt++)); do
            booted=$("$adb" shell getprop sys.boot_completed)
            [[ "$booted" == 1 ]] && break
            sleep 2
          done
          [[ "$booted" == 1 ]]
          "$adb" shell input keyevent KEYCODE_WAKEUP
          "$adb" shell wm dismiss-keyguard
          "$adb" install -g dist/YoruGram-Offline-Test.apk
          package=org.yorugram.messenger.web.smoke
          "$adb" shell am start -W -n "$package/org.telegram.messenger.DefaultIcon"
          sleep 5
          "$adb" shell pidof "$package"
          resumed=$("$adb" shell dumpsys activity activities | sed -n '/topResumedActivity=/p')
          [[ "$resumed" == *"$package/"* ]]
          "$adb" exec-out screencap -p > dist/YoruGram-Android.png
      - uses: actions/upload-artifact@v4
        if: inputs.use_project_api != true
        with:
          name: YoruGram-Android-first-launch
          path: dist/YoruGram-Android.png
          if-no-files-found: error
          retention-days: 7
