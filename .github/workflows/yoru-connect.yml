name: Yoru Connect tests
on:
  push:
    branches: ['yoru/foundation']
    paths:
      - 'yoru-connect/**'
      - '.github/workflows/yoru-connect.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yoru-connect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise account, trial and device APIs
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          .venv/bin/python -m unittest discover -v -s tests
      - name: Exercise WireGuard in isolated network namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iputils-ping iproute2
          sudo modprobe wireguard
          sudo bash tests/wireguard-smoke.sh "$PWD/.venv/bin/python"
